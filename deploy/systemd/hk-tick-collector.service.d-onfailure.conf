# Drop-in for hk-tick-collector.service. Install as:
#   /etc/systemd/system/hk-tick-collector.service.d/onfailure.conf
#
# The in-process host monitor cannot report its own host's death, so cover the
# crashloop case from outside. Restart=always means this only triggers once
# StartLimitBurst is exhausted -- i.e. the service has genuinely given up.
[Unit]
OnFailure=hk-tick-collector-failure@%n.service
