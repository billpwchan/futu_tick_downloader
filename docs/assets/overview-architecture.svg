<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc">
  <title id="title">HK Tick Collector 資料流</title>
  <desc id="desc">正式行情經標準化、記憶體佇列及寫入執行緒存入每日 SQLite。Mock 回放直接寫入測試資料庫。SQLite 可產生校驗歸檔；監控訊號送往 Telegram。</desc>
  <defs>
    <style>
      .title { font: 700 31px system-ui, sans-serif; fill: #102a43; }
      .tag { font: 700 16px system-ui, sans-serif; fill: #486581; }
      .name { font: 700 20px system-ui, sans-serif; fill: #102a43; }
      .detail { font: 400 15px system-ui, sans-serif; fill: #486581; }
      .card { fill: #ffffff; stroke: #b4c6d6; stroke-width: 1.5; }
      .source { fill: #e8f2ff; stroke: #77a7e7; }
      .data { fill: #e5f7ee; stroke: #75c99e; }
      .ops { fill: #fff4df; stroke: #e5b95c; }
      .line { fill: none; stroke: #52718a; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #52718a; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52718a"/>
    </marker>
  </defs>
  <rect width="1280" height="630" fill="#f7fafd"/>
  <text x="40" y="55" class="title">從行情到可驗證的日檔</text>
  <text x="40" y="92" class="tag">正式採集</text>

  <rect x="40" y="112" width="205" height="118" rx="14" class="card source"/>
  <text x="59" y="154" class="name">Futu OpenD</text>
  <text x="59" y="184" class="detail">Push + 可選 poll 備援</text>

  <rect x="284" y="112" width="205" height="118" rx="14" class="card"/>
  <text x="303" y="154" class="name">映射與校驗</text>
  <text x="303" y="184" class="detail">欄位標準化</text>

  <rect x="528" y="112" width="205" height="118" rx="14" class="card"/>
  <text x="547" y="154" class="name">記憶體佇列</text>
  <text x="547" y="184" class="detail">有限容量、批次緩衝</text>

  <rect x="772" y="112" width="205" height="118" rx="14" class="card"/>
  <text x="791" y="154" class="name">寫入執行緒</text>
  <text x="791" y="184" class="detail">批次 commit、重試</text>

  <rect x="1016" y="112" width="224" height="118" rx="14" class="card data"/>
  <text x="1035" y="154" class="name">SQLite WAL</text>
  <text x="1035" y="184" class="detail">YYYYMMDD.db</text>

  <path d="M245 171 H284" class="line"/>
  <path d="M489 171 H528" class="line"/>
  <path d="M733 171 H772" class="line"/>
  <path d="M977 171 H1016" class="line"/>

  <text x="40" y="296" class="tag">本機體驗：與正式採集分開</text>
  <rect x="40" y="318" width="267" height="100" rx="14" class="card source"/>
  <text x="59" y="357" class="name">Mock replay</text>
  <text x="59" y="384" class="detail">產生示範 tick</text>
  <rect x="356" y="318" width="267" height="100" rx="14" class="card data"/>
  <text x="375" y="357" class="name">測試 SQLite DB</text>
  <text x="375" y="384" class="detail">直接寫入，可查詢行數</text>
  <path d="M307 368 H356" class="dash"/>

  <text x="748" y="296" class="tag">日終資料處理</text>
  <rect x="748" y="318" width="492" height="100" rx="14" class="card data"/>
  <text x="767" y="357" class="name">SQLite backup → zstd → 校驗</text>
  <text x="767" y="384" class="detail">SHA-256 + manifest，通過後才可清理舊原檔</text>
  <path d="M1128 230 V273 H994 V318" class="line"/>

  <text x="40" y="487" class="tag">可觀測性</text>
  <rect x="40" y="507" width="378" height="93" rx="14" class="card ops"/>
  <text x="59" y="545" class="name">Health / Watchdog / 主機監控</text>
  <text x="59" y="572" class="detail">寫入、佇列、CPU、磁碟與記憶體</text>
  <rect x="470" y="507" width="294" height="93" rx="14" class="card ops"/>
  <text x="489" y="545" class="name">Telegram 通知</text>
  <text x="489" y="572" class="detail">健康摘要、異常與恢復</text>
  <path d="M418 553 H470" class="line"/>
  <text x="828" y="545" class="detail">collector failed 時由 systemd OnFailure 補發通知</text>
</svg>
