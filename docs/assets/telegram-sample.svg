<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Telegram 訊息示例">
  <defs>
    <linearGradient id="chatbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8fff4"/>
    </linearGradient>
    <style>
      .h { font: 700 30px 'Noto Sans TC', sans-serif; fill: #0f172a; }
      .bubble { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .t { font: 600 22px 'Noto Sans TC', sans-serif; fill: #111827; }
      .s { font: 500 18px 'Noto Sans TC', sans-serif; fill: #1f2937; }
    </style>
  </defs>

  <rect width="900" height="560" fill="url(#chatbg)"/>
  <text x="30" y="52" class="h">Telegram Product Message Sample</text>

  <rect x="40" y="90" width="820" height="190" class="bubble"/>
  <text x="70" y="135" class="t">🟢 HK Tick 健康摘要</text>
  <text x="70" y="170" class="s">結論：正常，盤中資料流穩定</text>
  <text x="70" y="205" class="s">KPI：延遲 1.8s | 寫入 12,480/min | 佇列 8/20,000</text>
  <text x="70" y="240" class="s">建議：維持觀察，下一次健康訊息 15 分鐘後</text>

  <rect x="40" y="320" width="820" height="190" class="bubble"/>
  <text x="70" y="365" class="t">🔴 HK Tick 警報</text>
  <text x="70" y="400" class="s">結論：異常，持久化停滯超過門檻</text>
  <text x="70" y="435" class="s">KPI：延遲 95.3s | 寫入 0/min | 佇列 420/20,000</text>
  <text x="70" y="470" class="s">建議：先執行 hk-tickctl logs --ops 1，再確認 OpenD 連線</text>
</svg>
